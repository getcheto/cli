# knot.yml — what the agent on this machine may do without being asked.
#
# Copy this next to your project, or to ~/.config/knot/knot.yml, and delete
# everything you do not need. Every key below has a safe default; the file is
# only here to let you widen them deliberately.

agent: builder

workspace:
  name: demo
  path: ~/Projects/demo

runtime:
  type: command
  command: claude
  args: ['-p'] # optional; the prompt arrives on stdin

# ── What a pass may do ───────────────────────────────────────────────────────
#
#   off      Nothing is handed to the runtime. Presence only.
#   notify   DEFAULT. Chat may wake the runtime — mentions, replies, comments
#            naming you. Tasks are reported and never started.
#   pull     Nothing starts on its own. You run `knot check --run`, or work
#            through `knot task verify` / `knot task accept` yourself.
#   auto     Eligible tasks may start on their own. Opt-in, and it also needs
#            automation.tasks.enabled below.
#
# Leaving this out means `notify`. A file that says nothing must never mean yes.
mode: notify

# How often you invoke it — a note to whoever reads this file, not a scheduler.
# `manual` you run it, `cron` a crontab line runs `knot inbox check`, `poll` you
# leave `knot run` open. Nothing here starts anything on its own.
cadence: manual

# ── Automatic task execution ─────────────────────────────────────────────────
#
# Everything below does nothing unless `mode: auto` AND `enabled: true`. Both,
# deliberately: one of them is easy to leave switched on by accident.
automation:
    tasks:
        enabled: false

        # Local working hours. Outside them nothing starts, the work stays in
        # Knot exactly as it was, and the next pass inside the window picks it
        # up. `until` is the last minute at which work may *begin* — a task that
        # starts at 23:58 is not interrupted at midnight.
        schedule:
            timezone: America/Argentina/Buenos_Aires
            from: '08:00'
            until: '23:59'

        # Which runtime this work is for. A machine acting as somebody else
        # stays out of it, so the search tasks can go to @indexer without
        # this one racing to them.
        notify:
            agent: builder

        filters:
            statuses:
                - inbox
                - ready

            # The workspace's own labels. Naming two means the tasks that
            # carry both, not either.
            tags:
                - development

            # Where the work is discussed. A different axis from tags, and
            # briefly the same one: `tags:` was a synonym for this while Knot
            # had no tags of its own.
            channels:
                - development

            # "Project" in the product sense; in Knot a workspace is the
            # project. `projects:` also works.
            workspaces:
                - demo

            assignment:
                # Default true. Work nobody handed you is the thing that needs
                # an explicit opt-out, not the other way round.
                only_assigned_to_me: true

            # Reviews ride on the same switch. Set false to automate tasks but
            # answer reviews by hand.
            include_reviews: true

# ── Several agents on one machine ────────────────────────────────────────────
#
# Each entry carries its own mode and automation, and inherits anything it does
# not set from the top of this file.
#
# agents:
#   - agent: builder
#     workspace: demo
#     mode: auto
#     automation:
#       tasks:
#         enabled: true
#   - agent: qa-demo
#     workspace: demo
#     mode: notify
